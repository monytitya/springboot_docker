<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bakong Secure Checkout | Ecomerc Shop</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00e5ff;
            --secondary: #007bff;
            --bg: #0a0e17;
            --card-bg: rgba(255, 255, 255, 0.05);
            --text: #ffffff;
            --text-dim: #a0a0a0;
            --success: #00c853;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 229, 255, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 123, 255, 0.05) 0%, transparent 40%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .checkout-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            text-align: center;
        }

        .logo-area {
            margin-bottom: 30px;
        }

        .logo-area h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-area p {
            color: var(--text-dim);
            font-size: 14px;
            margin-top: 5px;
        }

        .form-group {
            margin-bottom: 25px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 13px;
            color: var(--text-dim);
            margin-bottom: 8px;
            margin-left: 5px;
        }

        input {
            width: 100%;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 15px 20px;
            color: white;
            font-size: 16px;
            transition: all 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(255,255,255,0.06);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.2);
        }

        .currency-toggle {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            background: rgba(255,255,255,0.03);
            padding: 5px;
            border-radius: 15px;
            margin-bottom: 25px;
        }

        .toggle-btn {
            padding: 12px;
            border-radius: 12px;
            border: none;
            background: transparent;
            color: var(--text-dim);
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .toggle-btn.active {
            background: var(--primary);
            color: var(--bg);
            box-shadow: 0 4px 15px rgba(0, 229, 255, 0.3);
        }

        .pay-btn {
            width: 100%;
            background: linear-gradient(45deg, var(--secondary), var(--primary));
            border: none;
            border-radius: 15px;
            padding: 18px;
            color: white;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .pay-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 229, 255, 0.3);
        }

        .qr-section {
            display: none;
            margin-top: 20px;
            animation: zoomIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        .qr-container {
            background: white;
            padding: 20px;
            border-radius: 20px;
            margin: 20px auto;
            width: 220px;
            height: 220px;
        }

        .qr-container img {
            width: 100%;
            height: 100%;
        }

        .status-badge {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            margin-top: 10px;
            text-transform: uppercase;
        }

        .status-pending { background: rgba(255, 193, 7, 0.1); color: #ffc107; border: 1px solid rgba(255,193,7,0.2); }
        .status-success { background: rgba(0, 200, 83, 0.1); color: var(--success); border: 1px solid rgba(0,200,83,0.2); }

        .back-link {
            display: block;
            margin-top: 20px;
            color: var(--text-dim);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }

        .back-link:hover { color: var(--primary); }

        .loader {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            display: inline-block;
            animation: spin 1s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="checkout-card">
            <!-- Header -->
            <div class="logo-area">
                <h1>BAKONG SECURE</h1>
                <p>Ecomerc Shop Gateway</p>
            </div>

            <!-- Input Phase -->
            <div id="input-phase">
                <div class="currency-toggle">
                    <button class="toggle-btn active" onclick="setCurrency('USD')">USD</button>
                    <button class="toggle-btn" onclick="setCurrency('KHR')">KHR</button>
                </div>

                <div class="form-group">
                    <label>Amount to Pay</label>
                    <input type="number" id="amount" placeholder="0.00" value="1.00">
                </div>

                <div class="form-group">
                    <label>Customer Name</label>
                    <input type="text" id="customer-name" placeholder="John Doe">
                </div>

                <button class="pay-btn" onclick="generateQR()" id="pay-btn">GENERATE QR CODE</button>
            </div>

            <!-- QR Phase -->
            <div id="qr-phase" class="qr-section">
                <p style="font-size: 14px; color: var(--text-dim);">Scan with Bakong or any Bank App</p>
                <div class="qr-container">
                    <img id="qr-image" src="" alt="Payment QR">
                </div>
                <div id="status-container">
                    <div class="status-badge status-pending">
                        <span class="loader"></span> Awaiting Payment...
                    </div>
                </div>
                <a href="#" class="back-link" onclick="resetUI()">Cancel Transaction</a>
            </div>
        </div>
    </div>

    <script>
        let currentCurrency = 'USD';
        let pollingInterval = null;
        let activeTransactionId = null;

        function setCurrency(curr) {
            currentCurrency = curr;
            document.querySelectorAll('.toggle-btn').forEach(btn => {
                btn.classList.toggle('active', btn.innerText === curr);
            });
            document.getElementById('amount').placeholder = curr === 'USD' ? '0.00' : '0';
        }

        async function generateQR() {
            const amount = document.getElementById('amount').value;
            const name = document.getElementById('customer-name').value;
            const btn = document.getElementById('pay-btn');

            if (!amount || amount <= 0) {
                alert('Please enter a valid amount');
                return;
            }

            btn.innerHTML = '<span class="loader"></span> CREATING...';
            btn.disabled = true;

            try {
                const response = await fetch('/api/payment/generate-qr', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        amount: parseFloat(amount),
                        currency: currentCurrency,
                        customerName: name || 'Guest Customer',
                        orderId: 'ORD-' + Date.now()
                    })
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(errorText || 'Server error ' + response.status);
                }

                const data = await response.json();
                
                if (data.qrImageBase64) {
                    document.getElementById('qr-image').src = data.qrImageBase64;
                    document.getElementById('input-phase').style.display = 'none';
                    document.getElementById('qr-phase').style.display = 'block';
                    activeTransactionId = data.transactionId;
                    startPolling(data.transactionId);
                }
            } catch (err) {
                console.error(err);
                alert('ERROR: ' + err.message);
            } finally {
                btn.innerHTML = 'GENERATE QR CODE';
                btn.disabled = false;
            }
        }

        function startPolling(id) {
            if (pollingInterval) clearInterval(pollingInterval);
            pollingInterval = setInterval(async () => {
                try {
                    const response = await fetch(`/api/payment/transactions/${id}`);
                    const data = await response.json();
                    
                    if (data.status === 'SUCCESS' || data.status === 'PAID') {
                        showSuccess();
                        clearInterval(pollingInterval);
                    }
                } catch (err) {
                    console.error('Polling error', err);
                }
            }, 3000);
        }

        function showSuccess() {
            const container = document.getElementById('status-container');
            container.innerHTML = `
                <div class="status-badge status-success">
                    ✅ Payment Received Successfully
                </div>
                <div style="margin-top: 20px; color: var(--success); font-weight: 600;">
                    Thank you for your purchase!
                </div>
            `;
            // Redirect or show final receipt after 3 seconds
            setTimeout(() => {
                window.location.reload();
            }, 5000);
        }

        function resetUI() {
            if (pollingInterval) clearInterval(pollingInterval);
            document.getElementById('input-phase').style.display = 'block';
            document.getElementById('qr-phase').style.display = 'none';
        }
    </script>
</body>
</html>
